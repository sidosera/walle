[project]
name = "walle"
version = "0.1.0"
description = "Tiny arbitrary query-plan runner for local experiments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
walle-tester = "tester:main"
test = "walle_test:main"

[build-system]
requires = ["setuptools>=61", "wheel", "ruff"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["walle*"]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["tester", "walle_test"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
