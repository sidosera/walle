[project]
name = "walle"
version = "0.1.0"
description = "Tiny query-plan runner for local ES|QL experiments"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
walle-tester = "tester:main"
test = "walle_test:main"

[build-system]
requires = ["setuptools>=61", "wheel", "ruff"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rt*"]

[tool.setuptools]
py-modules = ["tester", "walle_test"]

[tool.pyright]
include = ["."]
executionEnvironments = [{ root = ".", extraPaths = ["."] }]
